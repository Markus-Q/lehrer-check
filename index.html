<title>Lehrer-Check</title>
<!--
  DESIGNRICHTUNG
  Konzept:   Ein korrigiertes Schulheft. Kariertes Papier, rote Randlinie, Lochung links. Lehrer werden wie Klassenarbeiten benotet:
             Kästchen ankreuzen, Rotstift-Kringel um die Gesamtzahl, Stempel für Auszeichnungen, Randbemerkungen für Kommentare.
  Schriften: Gloock (Display, wuchtige Serife für Titel, Namen, Zahlen) + Courier Prime (Text, Schreibmaschine wie ausgefülltes Formular).
  Farben:    Füllerblau #1b2a6b (Hauptfarbe), Korrekturrot #bd3022 (Akzent), Papier #efe8d6, Graphit #26251f. Alles als CSS-Variablen.
  Layout:    Linke Randlinie als Anker, Zeilen statt Karten, jede zweite Zeile eingerückt, Titel mit versetzter zweiter Zeile,
             sehr große Zahlen gegen winzige Großbuchstaben-Labels. Keine Schatten, keine Rundungen außer dem handgezeichneten Kringel.
  Bewegung:  1) Seitenaufbau: Zeilen werden von links nach rechts "geschrieben", rote Kringel zeichnen sich. 2) Hover: rote Wellenlinie
             unter dem Lehrernamen. 3) Nach dem Bewerten fällt ein Stempel aufs Blatt. Sonst Ruhe.
-->
